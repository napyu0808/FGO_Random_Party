<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>FGO ランダムパーティ</title>
  <!-- ?v=N on the assets makes browsers fetch fresh files after a deploy; bump N when releasing -->
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <main>
    <header>
      <h1>FGO ランダムパーティ</h1>
      <p id="status" role="status"></p>
    </header>

    <!-- slots and the cost box are positioned over the formation screenshot (see css/style.css) -->
    <section class="party" aria-label="パーティ">
      <div class="cost" aria-label="コスト">
        <span class="cost-label">TOTAL COST</span>
        <span class="cost-value"><b id="cost-now">0</b> / <span id="cost-max">118</span></span>
      </div>
    </section>

    <footer>
      <div class="buttons">
        <button id="next" type="button">1騎ずつ引く</button>
        <button id="draw" type="button">パーティを引く</button>
        <button id="reset" type="button">リセット</button>
      </div>
      <p class="hint">カードを押すとその枠だけ引き直します（空の枠はその枠だけ引きます） · <kbd>Space</kbd> 全員引き直し</p>
      <p class="credit">
        サーヴァントのデータ・画像：<a href="https://atlasacademy.io" target="_blank" rel="noopener">Atlas Academy</a>
        (<a href="https://opendatacommons.org/licenses/by/1-0/" target="_blank" rel="noopener">ODC-BY 1.0</a>)<br>
        Fate/Grand Order &copy; TYPE-MOON / FGO PROJECT · 非公式のファン制作ページです。
      </p>
    </footer>
  </main>

  <script src="data/servants.js?v=3"></script>
  <script src="js/main.js?v=3"></script>
</body>
</html>
